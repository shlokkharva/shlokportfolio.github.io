<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to New Portfolio...</title>
    <!-- REPLACE 'YOUR_VERCEL_LINK_HERE' WITH YOUR ACTUAL VERCEL URL BELOW -->
    <meta http-equiv="refresh" content="3;url=https://shlokportfolio-github-io.vercel.app/">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #07000d;
            color: #f0e6ff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            color: #cc1f1f;
            text-shadow: 0 0 10px rgba(204,31,31,0.5);
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2rem;
            color: rgba(240,230,255,0.7);
        }
        .loader {
            border: 4px solid rgba(204,31,31,0.2);
            border-top: 4px solid #cc1f1f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-top: 30px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <h1>Upgraded Portfolio</h1>
    <p>Swinging over to the new Spiderman-themed site...</p>
    <div class="loader"></div>
    <p style="font-size: 0.9rem; margin-top: 40px;">
        If you are not redirected automatically, 
        <a href="https://shlokportfolio-github-io.vercel.app/" style="color: #60a5fa;">click here</a>.
    </p>
</body>
</html>
